name: Build Forge Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.5-jdk17
    steps:
      - uses: actions/checkout@v4
      - run: gradle build
        working-directory: ./TankMod
      - uses: actions/upload-artifact@v4
        with:
          name: TankMod-Forge-1.20.1
          path: TankMod/build/libs/tankmod-1.0.0.jar
